name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "compose.backend*.yaml"
      - "deploy/backend/**"
      - "scripts/backend_*"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "compose.backend*.yaml"
      - "deploy/backend/**"
      - "scripts/backend_*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DEBUG: "False"
      MAMA_DEPLOYMENT_VALIDATE_ENV: "False"
      MAMA_AUTH_SIGNING_SECRET: ci-signing-secret-that-is-at-least-32-characters
      MAMA_AUTH_TWO_FACTOR_SECRET_KEY: ci-two-factor-secret-that-is-at-least-32-characters
      GEMINI_API_KEY: ci-placeholder-not-used-by-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-prod.txt
            backend/requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Compile Python
        run: python -m compileall -q app tests main.py
      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v
      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v
      - name: Static security scan
        run: bandit -q -r app/api app/core app/database app/deployment app/middleware app/observability -ll -ii
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements-prod.txt

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose environment
        run: cp backend/.env.example backend/.env
      - name: Validate production Compose
        run: docker compose -f compose.backend.yaml config --quiet
      - name: Build backend image
        run: docker build --pull --tag mama-ai-backend:ci ./backend
      - name: Inspect image user
        run: |
          test "$(docker image inspect mama-ai-backend:ci --format '{{.Config.User}}')" = "mama-ai"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
