name: Backend Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "mama-ai-v*"

permissions:
  contents: read

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DEBUG: "False"
      MAMA_DEPLOYMENT_VALIDATE_ENV: "False"
      MAMA_AUTH_SIGNING_SECRET: ci-signing-secret-that-is-at-least-32-characters
      MAMA_AUTH_TWO_FACTOR_SECRET_KEY: ci-two-factor-secret-that-is-at-least-32-characters
      GEMINI_API_KEY: ci-placeholder-not-used-by-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-prod.txt
            backend/requirements-ci.txt
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Compile
        run: python -m compileall -q app tests main.py
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"
      - name: Integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py"
      - name: Smoke tests
        run: python -m unittest discover -s tests/smoke -p "test_*.py"
      - name: Bandit review gate
        run: python -m app.release.bandit_gate
      - name: Dependency audit
        run: python -m pip_audit -r requirements-prod.txt
      - name: Release helper tests
        run: python -m unittest discover -s tests/unit -p "test_release_*.py"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose environment
        run: cp backend/.env.example backend/.env
      - name: Validate Compose
        run: docker compose -f compose.backend.yaml config --quiet
      - name: Build immutable candidate
        run: docker build --pull --tag mama-ai-backend:${{ github.sha }} ./backend
      - name: Verify non-root user
        run: test "$(docker image inspect mama-ai-backend:${{ github.sha }} --format '{{.Config.User}}')" = "mama-ai"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
